name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make all
      - run: make test
      - run: make e2e

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cbmc
      # The fast proofs only. The largest ones need more memory than a hosted
      # runner has; run `make verify` locally for the full set.
      - run: make proof-modbus_encode proof-mqtt_remaining proof-api_route proof-mqtt_publish
